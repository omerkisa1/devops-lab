---
- name: Install packages
  ansible.builtin.apt:
    name: [nginx, openssl, python3-cryptography]
    state: present
  
- name: Create TLS directory
  ansible.builtin.file:
    path: /etc/nginx/tls
    state: directory
    owner: root
    group: root
    mode: "0700"


- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy site config
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/app.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Generate TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ nginx_private_key_path }}"
    size: "{{ nginx_tls_key_size }}"
    type: RSA
    mode: "0600"


- name: Generate TLS CSR
  community.crypto.openssl_csr:
    path: "{{ nginx_csr_path }}"
    privatekey_path: "{{ nginx_private_key_path }}"
    common_name: "{{ nginx_floating_ip }}"
    subject_alt_name:
      - "IP:{{ nginx_floating_ip }}"


- name: Generate self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ nginx_certificate_path }}"
    privatekey_path: "{{ nginx_private_key_path }}"
    csr_path: "{{ nginx_csr_path }}"
    provider: selfsigned
    selfsigned_not_after: "+365d"
    mode: "0644"