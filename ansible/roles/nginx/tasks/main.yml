---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  
- name: Install open SSL
  ansible.builtin.apt:
    name: openssl
    state: present

- name: Install python3 crypto libs
  ansible.builtin.apt:
    name: python3-cryptography
    state: present

- name: Create TLS directory
  ansible.builtin.file:
    path: /etc/nginx/tls
    state: directory
    owner: root
    group: root
    mode: "0700"