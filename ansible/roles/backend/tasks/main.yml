---
- name: Create backend application directory
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy backend application files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ backend_app_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "main.py.j2", dest: "main.py" }
    - { src: "requirements.txt.j2", dest: "requirements.txt" }
    - { src: "Dockerfile.j2", dest: "Dockerfile" }

- name: Build backend Docker image
  community.docker.docker_image:
    name: "{{ backend_app_image }}"
    source: build
    state: present
    force_source: true
    build:
      path: "{{ backend_app_dir }}"

- name: Run backend container
  community.docker.docker_container:
    name: "{{ backend_app_container }}"
    image: "{{ backend_app_image }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    published_ports:
      - "{{ backend_app_port }}:8000"
    
    env:
      DB_HOST: "{{ vault_db_host }}"
      DB_PORT: "{{ db_port | string }}"
      DB_NAME: "{{ db_name }}"
      DB_USER: "{{ db_user }}"
      DB_PASSWORD: "{{ vault_db_password }}"
     


    healthcheck:
      test:
        - CMD
        - curl
        - -f 
        - http://127.0.0.1:8000/health

      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s