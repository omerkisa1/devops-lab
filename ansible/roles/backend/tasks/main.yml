---
- name: Create backend application directory
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy backend application files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ backend_app_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "main.py.j2", dest: "main.py" }
    - { src: "requirements.txt.j2", dest: "requirements.txt" }
    - { src: "Dockerfile.j2", dest: "Dockerfile" }

- name: Build backend Docker image
  community.docker.docker_image:
    name: "{{ backend_app_image }}"
    source: build
    build:
      path: "{{ backend_app_dir }}"

- name: Run backend container
  community.docker.docker_container:
    name: "{{ backend_app_container }}"
    image: "{{ backend_app_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ backend_app_port }}:8000"