---
- name: Install PostgreSQL dependencies
  ansible.builtin.apt:
    name:
      - postgresql
      - libpq-dev
      - python3-psycopg2
      - acl
    state: present

- name: Check postgres service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Configure PostgreSQL listen address
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '{{ vault_db_host }}'"
  notify: Restart PostgreSQL
  
- name: Allow backend application to connect
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: "host {{ db_name }} {{ db_user }} {{ vault_backend_db_cidr }} scram-sha-256"
    state: present
  notify: Restart PostgreSQL

- name: Apply PostgreSQL configuration changes
  ansible.builtin.meta: flush_handlers

- name: Create PostgreSQL application user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ vault_db_password }}"
    state: present
  become: true
  become_user: postgres

- name: Create a new database with name "main_db"
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    comment: My first database
  become: true
  become_user: postgres

- name: Copy sql script file to DB VM
  ansible.builtin.copy:
    src: schema.sql
    dest: /tmp/schema.sql
    mode: "0644"
  
  
- name: Run sql script
  community.postgresql.postgresql_script:
    login_db: main_db
    path: /tmp/schema.sql
  become: true
  become_user: postgres
